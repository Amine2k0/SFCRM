services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Containers must accept the hostname the browser uses.
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
      # Keep the database on the mounted volume, not the container filesystem.
      DB_NAME: data/db.sqlite3
    volumes:
      # Persist the SQLite database across container restarts.
      - sqlite-data:/app/data

volumes:
  sqlite-data:
