[tool.ruff]
line-length = 100
target-version = "py311"
# Migrations are generated by Django, not written by hand.
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = [
    # Django app packages are capitalised by convention (CRM, SFCRM), and
    # renaming them would break every import and the migration history.
    "N999",
    # Django idiom: Meta.fields, urlpatterns and similar class/module level
    # lists are plain mutable lists, not ClassVar-annotated.
    "RUF012",
    # The models use capitalised field names (Subject, Status, Client, Agent).
    # Renaming them means a migration and a template sweep; tracked separately.
    "N815",
]

[tool.ruff.lint.isort]
known-first-party = ["CRM", "SFCRM"]
